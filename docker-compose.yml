name: esg-analysis

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-memory}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8501}
    env_file:
      - path: .env
        required: false
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      ESG_API_URL: http://api:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  app_data:
  qdrant_data:
